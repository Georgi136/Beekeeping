<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bee body -->
  <ellipse cx="16" cy="16" rx="10" ry="14" fill="#FFD700"/>
  <!-- Stripes -->
  <rect x="10" y="6" width="3" height="20" fill="#333"/>
  <rect x="19" y="6" width="3" height="20" fill="#333"/>
  <!-- Wings -->
  <ellipse cx="8" cy="10" rx="6" ry="4" fill="#87CEEB" opacity="0.8"/>
  <ellipse cx="24" cy="10" rx="6" ry="4" fill="#87CEEB" opacity="0.8"/>
  <!-- Eyes -->
  <circle cx="12" cy="12" r="2" fill="#333"/>
  <circle cx="20" cy="12" r="2" fill="#333"/>
  <!-- Antennae -->
  <path d="M12 8 L10 4" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M20 8 L22 4" stroke="#333" stroke-width="1.5" fill="none"/>
</svg>